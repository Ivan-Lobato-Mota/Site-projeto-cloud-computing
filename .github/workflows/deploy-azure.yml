name: Build e Deploy - Azure Web App for Containers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ACR_NAME: aulacloudopet
  IMAGE_NAME: sal-e-cromo
  WEBAPP_NAME: sal-e-cromo
  RESOURCE_GROUP: rg-python-aula

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login no Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build e push da imagem
        run: |
          IMAGE=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy no Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # O hostname do Azure agora tem sufixo aleatorio e regiao embutidos,
      # entao ele e consultado em vez de montado a partir do nome do app.
      - name: Smoke test
        run: |
          HOST=$(az webapp show -g ${{ env.RESOURCE_GROUP }} -n ${{ env.WEBAPP_NAME }} \
                   --query defaultHostName -o tsv)
          echo "Testando https://$HOST"
          sleep 45
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$HOST/")
            echo "tentativa $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Verificando as demais paginas..."
              for p in "/about.php" "/wisdom.php?fragmento=42" "/chef.php?receita=7"; do
                PCODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$HOST$p")
                echo "  $p -> HTTP $PCODE"
                [ "$PCODE" = "200" ] || exit 1
              done
              exit 0
            fi
            sleep 15
          done
          echo "O app nao respondeu 200. Veja: az webapp log tail -g ${{ env.RESOURCE_GROUP }} -n ${{ env.WEBAPP_NAME }}"
          exit 1